name: Build Windows EXE

# 触发条件：推 v* 开头的 tag 时构建
on:
  push:
    tags:
      - "v*"
  # 也允许手动触发，方便测试
  workflow_dispatch:

permissions:
  contents: write  # 需要写权限来创建 Release 和上传资源

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: pyinstaller build.spec --noconfirm

      - name: Zip the dist folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist\OmniSenseVoice\* -DestinationPath OmniSenseVoice-${{ github.ref_name }}-win64.zip

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: OmniSenseVoice-${{ github.ref_name }}-win64.zip
          name: ${{ github.ref_name }}
          body: |
            ## 🎉 OmniSenseVoice ${{ github.ref_name }}

            ### 📥 下载
            下载 `OmniSenseVoice-${{ github.ref_name }}-win64.zip`，解压后双击 `OmniSenseVoice.exe` 即可运行。

            ### 🪟 首次运行注意
            1. **首次启动需要下载模型**（约 999MB），存到 `%APPDATA%\OmniSenseVoice\sensevoice-models`，只需下载一次。
            2. **首次按 F9 录音时**，Windows 会弹"麦克风权限"，点允许；如没弹，去「设置 → 隐私 → 麦克风」打开"允许桌面应用访问麦克风"。
            3. 如在以管理员身份运行的窗口里粘贴失效，请右键 `OmniSenseVoice.exe` 选择「以管理员身份运行」。

            ### 🎮 使用
            - 按住 **F9** 或 **F5** 说话，松开自动粘贴到光标位置。
            - 按 `Ctrl + C` 退出程序。
            - 想换模型精度：在 cmd 里运行 `OmniSenseVoice.exe --select`。

            ### 🔒 安全说明
            - 模型完全本地运行，断网可用，语音数据绝不上云。
            - 杀软可能误报（因为 PyInstaller 打包 + 全局键盘监听），可加白名单。
          draft: false
          prerelease: false
